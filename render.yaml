# Render config untuk backend CodeLooter API
# Pakai uv sebagai Python package manager (lebih cepat dari pip)
# Docs: https://render.com/docs/blueprint-spec
# Render mendukung uv: https://docs.astral.sh/uv/guides/integration/render/

services:
  - type: web
    name: codelooter-api
    runtime: python
    region: singapore
    plan: free  # 512MB RAM, sleep after 15 min idle. Untuk production: starter ($7/mo)
    branch: main
    rootDir: backend
    # Build: install uv lalu sync dependencies
    # uv sync jauh lebih cepat dari pip install (10-100x lebih cepat)
    buildCommand: |
      pip install uv &&
      uv sync --frozen --no-dev 2>/dev/null || uv sync --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CL_SUPABASE_URL
        sync: false  # set manual di Render dashboard
      - key: CL_SUPABASE_ANON_KEY
        sync: false
      - key: CL_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CL_JWT_SECRET
        sync: false
      - key: CL_CORS_ORIGINS
        value: '["https://codelooter.vercel.app"]'
      - key: CL_MAX_UPLOAD_MB
        value: '50'
      - key: PYTHON_VERSION
        value: '3.12.0'

# Catatan: Render Python runtime TIDAK punya Tesseract + poppler pre-installed.
# Untuk OCR support (image-based PDF), pakai Docker:
#   1. Ganti runtime dari "python" ke "Docker"
#   2. Dockerfile path: backend/Dockerfile (sudah include Tesseract + poppler + uv)
#   3. Hapus buildCommand dan startCommand (Dockerfile yang handle)
